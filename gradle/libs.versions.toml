[versions]
# gradle plugins
shadow = "9.6.1"

# test
junit = "6.1.3"

# common
jspecify = "1.0.1"
annotations = "26.1.0"

# core
netty = "4.2.18.Final"
guava = "33.7.1-jre"
gson = "2.14.0"
snakeyaml = "2.7"
joml = "1.10.9"
lz4 = "1.11.2"

# bukkit
spigot = "1.21.11-R0.1-SNAPSHOT"
paper = "1.21.11-R0.1-SNAPSHOT"
folia = "1.21.11-R0.1-SNAPSHOT"
packetevents = "2.14.0"
worldedit = "7.2.20"

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]

# test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform = { module = "org.junit.platform:junit-platform-launcher" }

# common
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

# core
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer" }
netty-transport = { module = "io.netty:netty-transport" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
joml = { module = "org.joml:joml", version.ref = "joml" }
lz4 = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }

# bukkit
spigot = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
folia = { module = "dev.folia:folia-api", version.ref = "folia" }
packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
worldedit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldedit" }
